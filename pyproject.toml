[project]
name = "fruit-fly-drone"
version = "0.1.0"
description = "A connectome-constrained fruit-fly quadcopter pilot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "pyarrow>=19,<24",
]

[project.optional-dependencies]
sim = [
    "flygym[warp]==2.1.0",
]
train = [
    "torch>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff==0.15.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
